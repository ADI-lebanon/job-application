<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADI Job Application</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <div class="langbar">
      <button type="button" id="langToggle" class="langbtn">English</button>
    </div>

    <div class="header">
      <div class="brand">
        <img src="adi-logo.png" alt="ADI Logo" class="logo" onerror="this.style.display='none'" />
      </div>
      <h1 id="t_title">نموذج التقديم للوظيفة</h1>
      <p id="t_intro">يرجى تعبئة المعلومات. الحقول التي تحتوي على <span class="req">*</span> مطلوبة.</p>
    </div>

    <div class="card">
      <form id="applicationForm">
        <div class="grid">
          <div class="field field--full">
            <label id="t_photo" for="photo">ارفع صورة لل ADI <span class="req">*</span></label>
            <input type="file" id="photo" accept="image/*" />
            <div id="t_photo_hint" class="hint">JPG/PNG/WebP — الحد الأقصى 5MB</div>
          </div>

          <div class="field">
            <label id="t_fullName" for="fullName">الاسم بالكامل <span class="req">*</span></label>
            <input type="text" id="fullName" />
          </div>

          <div class="field">
            <label id="t_phone" for="phone">رقم الهاتف <span class="req">*</span></label>
            <input type="text" id="phone" data-t-placeholder="phone_placeholder" />
          </div>
          <div class="field">
  <label id="t_position" for="position">ما هي الوظيفة التي تتقدم لها؟ <span class="req">*</span></label>
  <input type="text" id="position" />
</div>

          <div class="field">
            <label id="t_experienceField" for="experienceField">هل لديك خبرة في مجال عملنا؟ <span class="req">*</span></label>
            <select id="experienceField">
              <option value="">اختر…</option>
              <option value="yes">نعم</option>
              <option value="no">لا</option>
            </select>
          </div>

          <div class="field">
            <label id="t_shiftAbility" for="shiftAbility">هل تستطيع العمل في نظام مسائي ونهاري؟ <span class="req">*</span></label>
            <select id="shiftAbility">
              <option value="">اختر…</option>
              <option value="yes">نعم</option>
              <option value="no">لا</option>
            </select>
          </div>

          <div class="field field--full">
            <label id="t_experienceFieldDetails" for="experienceFieldDetails">إذا نعم، ما هي هذه الخبرة؟</label>
            <textarea id="experienceFieldDetails" rows="4" data-t-placeholder="experience_placeholder"></textarea>
          </div>

          <div class="field">
            <label id="t_retailExperience" for="retailExperience">هل لديك خبره في ريتال؟ <span class="req">*</span></label>
            <select id="retailExperience">
              <option value="">اختر…</option>
              <option value="yes">نعم</option>
              <option value="no">لا</option>
            </select>
          </div>

          <div class="field field--full">
            <label id="t_customerReaction" for="customerReaction">ماذا تفعل في حال زبون قد زعل؟ <span class="req">*</span></label>
            <textarea id="customerReaction" rows="4" data-t-placeholder="customer_placeholder"></textarea>
          </div>

          <div class="field field--full">
            <label class="checkbox" id="t_consent">
              <input type="checkbox" id="consent" />
              <span>
                أوافق على أن تقوم الشركة بجمع ومراجعة المعلومات المقدمة لأغراض التوظيف.
                <span class="req">*</span>
              </span>
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn" data-t="submit_btn">إرسال الطلب</button>
          <div id="status" class="status"></div>
        </div>
      </form>
    </div>

    <div class="footer" id="t_footer">
      ملاحظة: لا ترسل كلمات مرور أو معلومات بنكية. هذا النموذج للتوظيف فقط.
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
